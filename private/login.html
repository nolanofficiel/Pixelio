<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Pixelio</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=7">
</head>
<body>
  <div class="auth-layout">
    <aside class="auth-aside">
      <img src="/assets/img/hero-2.jpg" alt="" width="880" height="1184">
      <div class="aside-veil"></div>
      <a class="brand" href="/">
        <span class="brand-mark"><img src="/assets/img/pixelio-mark.webp" alt="" width="32" height="32"></span>
        Pixelio <small>galerie</small>
      </a>
      <div class="aside-quote">
        <p>« Mes photos ont enfin un endroit qui n'appartient qu'à moi. »</p>
        <span>Galerie privée · images</span>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-box">
        <a class="brand brand-mobile" href="/">
          <span class="brand-mark"><img src="/assets/img/pixelio-mark.webp" alt="" width="32" height="32"></span>
          Pixelio <small>galerie</small>
        </a>

        <a class="back" href="/">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5"></path>
            <polyline points="11.5 6 5.5 12 11.5 18"></polyline>
          </svg>
          Retour à l'accueil
        </a>

        <h1>Bon retour.</h1>
        <p class="sub">Connectez-vous pour retrouver votre galerie privée.</p>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="field">
            <label for="username">Nom d'utilisateur</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus placeholder="votre pseudo">
          </div>

          <div class="field">
            <label for="password">Mot de passe</label>
            <div class="input-group">
              <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
              <button type="button" class="reveal" data-target="password" aria-label="Voir le mot de passe" aria-pressed="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"></path>
                  <circle cx="12" cy="12" r="2.6"></circle>
                  <line class="eye-slash" x1="4" y1="20" x2="20" y2="4"></line>
                </svg>
              </button>
            </div>
          </div>

          <p class="form-error" id="error" role="alert" hidden></p>

          <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
        </form>

        <p class="auth-alt">Pas encore de compte ? <a href="/register">Créer un compte</a></p>
        <p class="auth-foot">Chaque compte ne voit que ses propres images.</p>
      </div>
    </main>
  </div>

  <script src="/assets/auth.js?v=7"></script>
</body>
</html>
